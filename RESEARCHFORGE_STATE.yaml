# ─── Reproducibility ──────────────────────────────────────────────────────────
reproducibility:
  fixed_seeds: [0, 1, 2, 3, 4]
  environment_hash: UNSET  # set via: pip freeze | sha256sum
  dependency_lock: requirements.txt
  platform_note: >
    Results verified on macOS (Apple Silicon). Cross-platform reproducibility
    not yet tested. sklearn's random_state parameter ensures training
    determinism given same seed and data order.

