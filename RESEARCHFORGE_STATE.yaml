releases:
  - version: RF-0.x
    date: 2026-09
    status: VERIFIED_BASELINE
    summary: >
      Reference implementation with RDG, ModelGenome (7 operators), ECRM,
      TrajectoryMemory, UCB policy, rule-based diagnosis, SafeRunner,
      GitHub retrieval, SQLite persistence, FastAPI, MATLAB export, RDE-Bench.
      17 tests. Key finding: trajectory memory does not beat flat ECRM at
      25-generation budget (NR-001).
    benchmark_delta: N/A (baseline)

  - version: RF-1.0.0-alpha.1
    date: 2026-09
    status: VERIFIED
    git_commit: 5b5e388
    total_tests: 77  # 17 + 30 + 22 + 8
    summary: >
      Infrastructure release. Adds adapter layer (GraphBackend + VectorIndexBackend
      protocols, SQLite/InMemory implementations, documented stubs),
      Scientific Validity Gate (4 checks), RF-0 regression harness.
      No changes to research algorithms. Behavioral equivalence verified.
      All 77 tests pass. ECRM scoring algorithms unchanged (AD-004).
    benchmark_delta: NO_REGRESSION  # regression harness confirmed
    acceptance_criteria_met: true

# ─── SVG-v1 Known Limitations ─────────────────────────────────────────────────
svg_v1_known_limitations:
  version: SVG-v1
  rf_release: RF-1.0.0-alpha.1
  source: researchforge/scientific_validity/__init__.py::SVG_V1_KNOWN_LIMITATIONS
  conceptual_corrections:
    BaselineFairnessValidator: >
      TrivialBaselineCheck (majority-class sanity only). Not a full
      protocol-level fairness comparison.
    LabelPermutationTest: >
      LabelRandomisationSanityCheck (heuristic threshold, n_shuffles=3 min).
      Not a publication-grade permutation test.
    StatisticalSignificanceTester_default_mode: >
      paired=True for seed-matched RF-vs-RF comparisons (correct default).
      Welch's unpaired test available via paired=False.
  implemented_checks:
    - exact_duplicate_split_leakage
    - label_randomisation_sanity
    - trivial_baseline_sanity
    - statistical_comparison_paired_t_plus_cohens_d
  known_missing:
